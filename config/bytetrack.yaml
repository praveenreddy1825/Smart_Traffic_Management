# ByteTrack tracker settings (used by Module 3).
# Values tuned for high-density pedestrian crowds and multi-class traffic.
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: bytetrack
# Stage 1: confident detections (>= this) are matched to existing tracks first
track_high_thresh: 0.18
# Stage 2: weak detections (between this and track_high_thresh) can still continue
# an existing track - this keeps IDs alive when a vehicle or person is partly hidden
track_low_thresh: 0.08
# An unmatched detection starts a NEW track ID if its confidence >= this
new_track_thresh: 0.18
# Frames a lost track is remembered (45 frames = 1.5 s at 30 FPS) before its ID is dropped
track_buffer: 45
# Matching threshold on the IoU-based cost (0.75 provides robust matching in dense crowds)
match_thresh: 0.75
# Combine detection confidence with box overlap when matching
fuse_score: True
